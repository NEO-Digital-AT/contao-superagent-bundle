# Terms of the SuperAgent per edition, shown on "Access keys and licences".
# The German text (neo_superagent_terms.de.yaml) is binding; a changed passage
# needs a new version in Neo\SuperAgentBundle\Licence\Terms::PASSAGES.
all:
    title: "All editions"
    text: |
        Answers: The answers are generated by a language model of another provider. They can be wrong, incomplete or unsuitable. You as the operator are responsible for the settings, knowledge and texts of the assistant and for its use on the website.

        Safety rules: Privacy mode and the rule against medical advice lower the risk but do not rule it out. Not every piece of personal data is recognised, and a language model can ignore a rule.

        Privacy: You are responsible for the privacy policy, the consent of visitors and the data processing agreement with the AI service. The texts supplied (PRIVACY.md, default texts) are templates, not legal advice.

        Costs: You bear the costs at the AI service and at other services you choose. Limiting the requests lowers the risk of misuse but does not prevent it.

        Liability: The manufacturer of this extension accepts no liability for content and costs under these points. What exactly applies and which exceptions there are is set out in the licence terms.
basic:
    title: "Edition Basic"
    text: |
        Web search: Content of other websites that the assistant reads can be wrong or out of date. The manufacturer of this extension does not check it.

        Forwarding: It is not guaranteed that forwarded requests arrive by e-mail. Check your mail delivery and your mailbox.
plus:
    title: "Edition Plus"
    text: |
        MCP servers: Through an MCP server the assistant can call functions of another system, including functions that change or delete data there or show customer data. Only approve tools with little risk or tools limited by a skill, and test the assistant before you make it visible to visitors. The supplied templates block risky tools by default. A residual risk remains, because a language model can be wrong or be misled by cleverly worded messages.

        Skills from other sources: The manufacturer of this extension checks only their structure, not their content.

        Knowledge sources: Anything in the chosen folders or pages, for example on OneDrive or in Notion, can be shown by the chat to any visitor. Only choose content that may be public.

        Liability: The manufacturer of this extension accepts no liability for damage caused by approved tools, skills and knowledge sources. What exactly applies and which exceptions there are is set out in the licence terms.
pro:
    title: "Edition Pro"
    text: |
        Actions with consequences: Through approved tools the assistant can carry out actions, for example create bookings, generate payment links or write entries in a CRM. Check the results. The manufacturer of this extension accepts no liability for such actions and their consequences; what exactly applies and which exceptions there are is set out in the licence terms.

        Voice input: The transcription can render what was said incorrectly; the visitor checks the text before sending it. The recording goes unfiltered to the transcription service. Mention this in your privacy policy.
